name: インスタの鍵を延長する

on:
  schedule:
    - cron: "0 1 * * 1"   # 毎週月曜 10:00（日本時間）
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 延長して保存し直す
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -o pipefail
          python scripts/refresh_token.py | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
